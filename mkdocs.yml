theme:
  name: material
  custom_dir: overrides
  favicon: logo.svg
  logo: logo.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: indigo
      accent: green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.action.edit
    - navigation.top
    # Collapsible nav: navigation.sections + navigation.expand are intentionally
    # omitted so nested groups (e.g. the node pages under Flow Graph > Nodes)
    # collapse behind a chevron instead of rendering fully expanded.
    # - navigation.tabs
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

repo_url: https://github.com/theprototype-app/docs
edit_uri: edit/docs/

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.tilde

plugins:
  - search
  - git-revision-date
