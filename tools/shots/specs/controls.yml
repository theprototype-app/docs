# docs/controls.md — Viewport navigation, Transform gizmo, The pivot of a multi-selection.
# Shoot: e2e-slot -- node tools/shots/shoot.cjs controls     Re-annotate: node tools/shots/annotate.cjs controls
page: controls
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
  # the demo scene every shot starts from (a fresh, empty session each time)
  scene:
    - {create: Box, name: Crate, at: [0, 0.8, 0], scale: 1.6, color: '#c9a26b'}
    - {create: Sphere, name: Ball, at: [2.9, 0.8, 0.9], scale: 0.8, color: '#6c8cd5'}
    - {create: Cylinder, name: Post, at: [-2.8, 1, -0.6], color: '#81b29a'}
    - {camera: {pos: [5.6, 4, 7], target: [0, 0.8, 0]}}
shots:
  - id: viewport-overview
    alt: >-
      The editor with three objects on the floor grid. 1: the selected crate with the Move gizmo on it.
      2: the transform tools on the bottom bar — Move, Rotate, Scale and Pivot. 3: the floor grid.
    tryit: controls-viewport
    setup:
      - {select: Crate}
      - {mode: translate}
    crop: {canvas: true}
    fade: none
    annotate:
      - {n: 1, at: {object: Crate}, shape: circle, label: selected, badge: tl}
      - {n: 2, at: {union: [{selector: 'p[title="Move (1)"]'}, {selector: 'p[title^="Pivot:"]'}]}, shape: box, label: gizmo tools, badge: l}
      - {n: 3, at: {rect: [300, 650, 60, 40]}, shape: arrow, label: floor grid, from: [-10, -90]}

  - id: gizmo-modes
    alt: >-
      The same crate three times: with the Move gizmo (three arrows), the Rotate gizmo (three rings) and the
      Scale gizmo (three handles with cubes on their ends).
    setup:
      - {select: Crate}
      - {camera: {pos: [5, 3.8, 6.2], target: [0, 0.8, 0]}}
    crop: {around: {object: Crate}, size: [520, 440]}
    # the toolbar cells, not the store: only they swap the gizmo (a store write leaves the Move gizmo up)
    variants:
      - {steps: [], suffix: move, caption: '1 · Move'}
      - {click: 'p[title="Rotate (2)"]', suffix: rotate, caption: '2 · Rotate'}
      - {click: 'p[title="Scale (3)"]', suffix: scale, caption: '3 · Scale'}
    compose: row

  - id: multi-pivot
    alt: >-
      Three objects selected together in Rotate mode. 1: one gizmo turns the whole set about the median point
      of the selection. 2: the Pivot button on the bottom bar, which steps through the pivot modes.
    setup:
      - {select: [Crate, Ball, Post]}
      - {pivot: median}
      - {click: 'p[title="Rotate (2)"]'}
    crop: {rect: [250, 140, 940, 760]}
    annotate:
      - {n: 1, at: {object: Crate, point: center}, shape: arrow, label: median point, from: [-90, -175]}
      - {n: 2, at: {selector: 'p[title^="Pivot:"]'}, shape: circle, label: pivot mode, badge: tr}

  - id: orbit-zoom-focus
    alt: >-
      A five-second loop: dragging on the 3D view orbits the camera around the scene, the mouse wheel zooms
      in, and pressing F with the ball selected frames it.
    video:
      lead: 400
      actions:
        - {drag: [820, 420, 600, 400], steps: 50, wait: 300}
        - {wheel: -900, ticks: 9, wait: 300}
        - {clickObject: Ball, wait: 350}
        - {key: f, wait: 1400}
      tail: 500
    setup: []
    crop: {rect: [200, 120, 1040, 640]}
    fade: vignette
