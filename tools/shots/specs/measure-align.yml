page: measure-align
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
# 83-batch3: core's measure-tool fixture — a 2 × 1 × 1 box on the floor — with the chain's points put in through
# measure.addMeasurePoint (the same call a snapped click ends in) at the box's corners: exact lengths, no aiming.
# Labels are DOM pills (#measure-labels .measure-label[data-kind=segment|angle|total]).
- id: measure-chain
  replaces: img/measure-align/measure-chain.png
  kind: ui
  setup:
    - {create: 'Box 2 1 1', name: Box, at: [0, 0.5, 0], color: '#e07a5f'}
    - {camera: {pos: [3.2, 3.0, 4.6], target: [0, 0.4, 0]}}
    - eval: >-
        const m = window.__stores.measure; m.startMeasure();
        for (const p of [[-1, 1, 0.5], [1, 1, 0.5], [1, 1, -0.5], [1, 0, -0.5]]) m.addMeasurePoint(p, 'vertex')
    - {wait: 1500}
  crop: {around: {object: Box, offset: [70, 20]}, size: [688, 500], ui: true}
  fade: [l, r, t, b]
  alt: >-
    A chain of three measured segments along the corners of a 2 × 1 × 1 box: 2 m along the top front edge, 1 m back
    along the side and 1 m down the back corner, with a 90° label at each joint and the total, 4 m, at the end.
    1: a segment's length. 2: the angle at a joint. 3: the total.
  caption: A chain of three measured segments with lengths.
  annotate:
    - {n: 1, at: {selector: '#measure-labels .measure-label[data-kind="segment"]'}, shape: box, pad: 3, badge: t, key: 'Every **segment** shows its length.'}
    - {n: 2, at: {selector: '#measure-labels .measure-label[data-kind="angle"]'}, shape: box, pad: 3, badge: r, key: 'Every corner shows the **angle** between its two segments.'}
    - {n: 3, at: {selector: '#measure-labels .measure-label[data-kind="total"]'}, shape: box, pad: 3, badge: b, key: 'The end of the chain shows the **total**.'}
# two kept measurements (scene items, measureItems.createMeasurement) — core's fixture plus its short-segment chain
- id: measure-items
  replaces: img/measure-align/measure-items.png
  kind: ui
  setup:
    - {create: 'Box 2 1 1', name: Box, at: [0, 0.5, 0], color: '#e07a5f'}
    - eval: >-
        const mi = window.__stores.measureItems;
        mi.createMeasurement([[-1, 1, 0.5], [1, 1, 0.5], [1, 1, -0.5]]);
        mi.createMeasurement([[-1, 0, 1.2], [-0.94, 0, 1.2], [-0.88, 0, 1.2], [-0.82, 0, 1.2]]);
        window.__stores.objectActions.applySelectionSet([], false)
    - {camera: {pos: [3.0, 3.2, 5.0], target: [0, 0.4, 0.3]}}
    - {wait: 1500}
  crop: {around: {object: Box, offset: [0, 30]}, size: [688, 500], ui: true}
  fade: [l, r, t, b]
  alt: >-
    Two kept measurements: a 2 m + 1 m chain along the top of a box with its 90° corner and a 3 m total, and in
    front of it a chain of short 6 cm segments whose labels step aside so none overlap. 1: the 90° corner. 2: the
    short segments' labels.
  caption: Two kept measurements.
  annotate:
    - {n: 1, at: {selector: '#measure-labels .measure-label[data-kind="angle"]'}, shape: box, pad: 3, badge: r, key: 'A kept measurement shows the same lengths, angles and total, for everyone.'}
    - {n: 2, at: {selector: '#measure-labels .measure-label[data-kind="total"]', nth: 1}, shape: box, pad: 3, label: labels step aside, badge: b, key: 'Labels of **short segments** step aside so they never overlap.'}
# point 2 of a kept measurement picked up (measure.editMeasurement + measureEditStep(1): the picked point is the
# one a click on it takes); the box sits right of centre so the crop holds it beside the Inspector
- id: measure-edit
  replaces: img/measure-align/measure-edit.png
  kind: ui
  setup:
    - {create: 'Box 2 1 1', name: Box, at: [2, 0.5, 0], color: '#e07a5f'}
    - eval: >-
        const s = window.__stores;
        const item = s.measureItems.createMeasurement([[1, 1, 0.5], [3, 1, 0.5], [3, 1, -0.5]]);
        s.measure.editMeasurement(item.uuid);
        s.measure.measureEditStep(1, () => null)
    # further back and left: the chain (x 1..3) between the crop's left edge and Properties (its angle label was under the panel)
    - {camera: {pos: [0.2, 4.5, 11], target: [0.2, 0.5, 0]}}
    - {eval: "window.__stores.inspectorKind.set('selection'); window.__stores.inspectorClose.set(false)"}
    - {wait: 1800}
  crop: {around: {selector: '#inspector'}, size: [688, 860], offset: [-190, 0], ui: true}
  fade: [l]
  alt: >-
    Editing a measurement: point 2 of a kept chain on a box is picked up, the points are drawn in yellow, and
    Properties on the right shows the Measurement object. 1: the picked point. 2: the Measurement in Properties.
  caption: Editing a measurement.
  annotate:
    - {n: 1, at: {selector: '#measure-labels .measure-label[data-kind="angle"]'}, shape: circle, label: picked up, badge: b, key: 'A click on a point **picks it up**; the next click puts it down (it snaps).'}
    - {n: 2, at: {text: Object3D}, shape: box, pad: 3, badge: l, key: 'The measurement is an object: **Properties** shows it like any other.'}
- id: arrange
  replaces: img/measure-align/arrange.png
  kind: ui
  setup:
    - {create: Box, name: Crate, at: [-1.6, 0.5, 0], color: '#e07a5f'}
    - {create: Sphere, name: Ball, at: [0.2, 1.4, 0.6], color: '#6d9dc5'}
    - {create: Cylinder, name: Can, at: [1.8, 0.8, -0.4], color: '#81b29a'}
    - {select: [Crate, Ball, Can]}
    - {eval: "window.__stores.inspectorKind.set('selection'); window.__stores.inspectorClose.set(false)"}
    - {wait: 1500}
    - {eval: "document.getElementById('arrange-section')?.scrollIntoView({block: 'center'})"}
    - {wait: 600}
  crop: {selector: 'section.sec-panel:has(#arrange-section)', pad: 10}
  fade: []
  alt: >-
    Properties ▸ Arrange for three selected objects: Align X, Y and Z with Min, Centre and Max, Align to Selection or
    Active, Distribute by centres or gaps, and Drop to ground. 1: Align to. 2: Drop to ground.
  caption: The Properties Arrange section for three selected objects.
  annotate:
    - {n: 1, at: {selector: '#arrange-align-to'}, shape: box, pad: 3, badge: r, key: '**Align to**: the whole selection''s bounds, or the active (last picked) object.'}
    - {n: 2, at: {selector: '#arrange-drop'}, shape: box, pad: 3, badge: l, key: '**Drop to ground**: each object rests on the surface below it.'}
