# docs/water.md — water objects, presets, Selection passes through, pour emitters.
# Shoot: e2e-slot -- node tools/shots/shoot.cjs water     Re-annotate: node tools/shots/annotate.cjs water
# 83-batch3: real captures (were re-crops of 1.25-1.40 evidence). Water is made the way Add ▸ Water does it
# (waterActions.makeWater on a box from addObjects.spawnAtPoint); the Aquarium is Templates ▸ Examples ▸ Aquarium.
# 3D shots on a remote slot (E2E_PC=).
page: water
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
  - id: pool
    replaces: img/water/pool.png
    alt: >-
      A pool in daylight: light caustics ripple on the ground under the water, with a ball and a crate floating in it.
      1: the caustics on the pool floor.
    caption: A pool in daylight.
    kind: view
    fade: vignette
    scene:
      - {env: daylight}
      - eval: >-
          (() => { const S = window.__stores;
          S.waterActions.makeWater(S.addObjects.spawnAtPoint('/create Box 6 1.5 4', [0, 0.75, 0]), 'pool'); })()
      - {wait: 600}
      - {create: Sphere, name: Ball, at: [-1, 1.45, 0.4], scale: 0.7, color: '#e8d6a8'}
      - {create: Box, name: Crate, at: [1, 1.4, -0.4], scale: 0.9, color: '#c95f6b'}
      - {camera: {pos: [5.6, 4.4, 7.2], target: [0, 0.7, 0]}}
    setup:
      - {deselect: true}
      - {wait: 2000}
    crop: {around: {object: Pool}, size: [1120, 600]}
    annotate:
      - {n: 1, at: {object: Pool, point: center, offset: [-60, 60]}, shape: circle, label: caustics, badge: bl, key: '**Caustics**: the light the surface focuses onto the floor, moving with the waves.'}

  - id: lava
    replaces: img/water/lava.png
    alt: >-
      A water tank with the Lava preset: glowing orange and black, opaque, its surface heaving slowly.
    caption: The Lava preset.
    kind: view
    fade: vignette
    scene:
      - eval: >-
          (() => { const S = window.__stores;
          const o = S.waterActions.makeWater(S.addObjects.spawnAtPoint('/create Box 3 1.6 2', [0, 0.8, 0]), 'tank');
          S.waterActions.applyWaterPreset(o.uuid, 'lava'); })()
      - {camera: {pos: [3.4, 3.1, 4.8], target: [0, 0.8, 0]}}
    setup:
      - {deselect: true}
      - {wait: 2500}
    crop: {around: {object: Water tank}, size: [1000, 600]}

  - id: underwater-aquarium
    replaces: img/water/underwater-aquarium.png
    alt: >-
      The camera inside the Aquarium example: blue-green water with fog, a column of bubbles rising from the air stone
      past the plants, clownfish, blue tangs and a rock. 1: the bubbles from the air stone.
    caption: Inside the Aquarium preset.
    kind: view
    fade: vignette
    scene:
      - eval: >-
          (async () => { const S = window.__stores, D = window.__docs; await S.sceneTemplates.loadTemplatesIndex();
          const e = D.get(S.sceneTemplates.examples).find((x) => x.slug === 'aquarium'); await S.sceneTemplates.loadRemoteScene(e, {}); })()
      - {wait: 6000}
    setup:
      # in the water (x -2..2, y 0.9..2.9, z -0.8..0.8), by the front glass at the left end, looking right past Rock big
      # (x ≤ -1.0, z ≤ -0.1) to the air stone (-0.5, 1.1, 0.3), its bubbles and the fish over it; nothing in between
      - {camera: {pos: [-1.8, 1.7, 0.7], target: [-0.2, 1.55, 0]}}
      - {deselect: true}
      - {wait: 3000}
    # clear of the HUD: the bottom bar (y > 830) and the left buttons (x < 65)
    # (and clear of the top bar, y < 60, and the chips at the top right, x > 1250)
    # a fixed rect (the fish swim, so a crop round them moves): the bubble column, the clownfish and the rock
    crop: {rect: [355, 70, 880, 520]}
    annotate:
      - {n: 1, at: {rect: [790, 120, 170, 240]}, shape: circle, label: bubbles, badge: tr, key: 'The **bubbles** rise from the air stone; underwater the view takes the water''s fog and tint.'}

  - id: selection-passes-through
    replaces: img/water/selection-passes-through.png
    alt: >-
      Configure Scene ▸ Advanced ▸ Selection passes through, with Water ticked, beside the Aquarium example, where an
      Alt+click in the tank shows the chip 1 of 2 · Aquarium water. 1: the Water switch. 2: the Alt+click chip.
    caption: Configure Scene ▸ Advanced ▸ Selection passes through.
    scene:
      - eval: >-
          (async () => { const S = window.__stores, D = window.__docs; await S.sceneTemplates.loadTemplatesIndex();
          const e = D.get(S.sceneTemplates.examples).find((x) => x.slug === 'aquarium'); await S.sceneTemplates.loadRemoteScene(e, {}); })()
      - {wait: 6000}
      # the tank right of the view's middle, so it shows in the column beside the panel
      - {camera: {pos: [-1.6, 2.6, 5.6], target: [-1.6, 1.7, 0]}}
    setup:
      - {section: Advanced}
      - {eval: "document.querySelector('[data-anchor=\"Selection\"]')?.scrollIntoView({block: 'center'})"}
      - {wait: 500}
      # hold the real chip (it hides 1.6 s after the click; a slow slot shoots later than that)
      - eval: >-
          (() => { const s = window.__stores.pickCycle.pickCycleHint; let last = null;
          s.subscribe((h) => { if (h && h.mode === 'picked') last = h; else if (!h && last) queueMicrotask(() => s.set(last)); }); })()
      - {key: Escape}
      - {keyDown: Alt}
      - {press: {object: Aquarium water, point: center}}
      - {release: true}
      - {wait: 400}
    crop: {around: {selector: '[data-anchor="Selection"]'}, size: [688, 720], offset: [-170, 0], ui: true}
    annotate:
      - {n: 1, at: {selector: '#pick-through-water'}, shape: box, pad: 3, badge: l, key: 'With **Water** ticked, a click in a tank selects what is inside it, not the water.'}
      - {n: 2, at: {selector: '#pick-cycle-hint'}, shape: box, label: which one, badge: b, key: '<kbd>Alt</kbd>+click still reaches the water: the chip says **which one** you have.'}

  - id: pour-emitters
    replaces: img/water/pour-emitters.png
    alt: >-
      A water tank with two pour emitters: one on the tank's own rim and a separate spout to its left, each arcing a
      stream of blue drops onto the ground. 1: the spout. 2: the rim pour.
    caption: Two pour emitters arcing drops over a water tank.
    kind: view
    fade: vignette
    scene:
      - {env: daylight}
      - eval: >-
          (() => { const S = window.__stores, W = S.waterActions;
          const tank = W.makeWater(S.addObjects.spawnAtPoint('/create Box 2.4 1.4 1.4', [0, 0.7, 0]), 'tank');
          W.setObjectPour(tank.uuid, {});
          const spout = S.addObjects.spawnAtPoint('/create Sphere 0.15', [-3.2, 1.9, 0]); W.makePour(spout);
          W.updateObjectPour(spout.uuid, {dir: [1, 0.3, 0], speed: 2.6}, {immediate: true}); })()
      - {camera: {pos: [0.4, 2.9, 7.4], target: [0, 1, 0]}}
    setup:
      - {deselect: true}
      - {eval: "window.__stores.physics.toggleSimulation()"}
      - {wait: 3500}
    crop: {around: {object: Water tank}, size: [1120, 600]}
    annotate:
      - {n: 1, at: {object: Pour}, shape: circle, label: spout, badge: tl, key: 'A **spout** (Add ▸ Water ▸ Pour): a marker that pours wherever you put it.'}
      - {n: 2, at: {object: Water tank, point: top, offset: [150, 0]}, shape: circle, label: rim pour, badge: tr, key: 'A tank''s own **pour** starts on its rim.'}
