page: lod
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
# 83-batch3: Configure Scene ▸ View ▸ Level of detail (SceneLodSection: the slider row #scene-lod-bias)
- id: lod-distance
  replaces: img/lod/lod-distance.png
  kind: ui
  setup:
    - {section: Level of detail}
    - {eval: "document.getElementById('scene-lod-bias')?.scrollIntoView({block: 'center'})"}
    - {wait: 600}
  crop: {selector: 'section.sec-panel:has(#scene-lod-bias)', pad: 10}
  fade: []
  alt: >-
    Configure Scene ▸ Level of detail, in the scene's settings group: the LOD distance slider at 1, with the note that
    above 1 keeps full detail further away. 1: the LOD distance slider.
  caption: Configure Scene ▸ Level of detail.
  annotate:
    - {n: 1, at: {selector: 'section.sec-panel:has(#scene-lod-bias) input[type="range"]'}, shape: underline, badge: l, key: '**LOD distance**: above 1 keeps full detail further away, below 1 switches to lighter levels sooner.'}
