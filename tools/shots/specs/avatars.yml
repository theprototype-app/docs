# docs/avatars.md
page: avatars
defaults: {device: desktop, theme: dark, dpr: 2, format: webp}
shots:
  - id: studio-desktop
    replaces: img/avatars/studio-desktop.png
    kind: ui
    alt: >-
      Customize character on a computer, two parts of one screen side by side: your character on a lit disc in the
      studio, labelled You, and the drawer with Show in scene, Surprise me, the character presets, head, hat and colours.
    caption: Customize character on a computer. The studio is on the left of the screen, the drawer on the right.
    setup:
      - {eval: "window.__stores.characterModalOpen.set(true)"}
      - {wait: 4000}
    crop: {rect: [376, 65, 338, 835]}
    variants:
      - {steps: [], crop: {rect: [376, 65, 338, 835]}, suffix: studio}
      - {steps: [], crop: {rect: [1102, 65, 338, 835]}, suffix: drawer}
    compose: row
