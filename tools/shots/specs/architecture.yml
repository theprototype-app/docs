page: architecture
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
# 83-batch3: the Add menu's own pieces (primitivesCatalog.js commands) placed by hand. A "Wall with door and
# windows" (6 m, 1 door + 2 windows) has its openings at 1, 3 and 5 m from its start, the door in the middle
# (archGeometry.wallOpenings); the wall starts at x = -3, so the door is at x = 0 and the windows at x = ∓2.
# A door / window sits centred on its opening at floor level.
- id: house
  replaces: img/architecture/house.png
  kind: view
  scene: &house
    - {create: 'Wall 6 2.8 0.2 3', name: Front, at: [-3, 0, 0], color: '#f2cc8f'}
    - {create: 'Wall 4 2.8 0.2 0', name: Left side, at: [-3, 0, 0], rot: [0, 90, 0], color: '#e07a5f'}
    - {create: 'Wall 4 2.8 0.2 0', name: Right side, at: [3, 0, 0], rot: [0, 90, 0], color: '#e07a5f'}
    - {create: 'Door 1 2.1 0', name: Door, at: [0, 0, 0], color: '#5fb0b7'}
    - {create: 'Window 1.2 1.2 0.9 1', name: Window L, at: [-2, 0, 0], color: '#b8b2a7'}
    - {create: 'Window 1.2 1.2 0.9 0', name: Window R, at: [2, 0, 0], color: '#b8b2a7'}
    - {create: 'Staircase 3 1 16 0.18', name: Stair, at: [0.6, 0, -2.2], color: '#81b29a'}
    - {deselect: true}
  setup:
    - {camera: {pos: [5.2, 3.4, 8.4], target: [0, 1.2, -1.2]}}
    - {wait: 1500}
  crop: {around: {union: [{object: Front}, {object: Left side}, {object: Right side}, {object: Stair}]}, size: [1080, 600]}
  fade: vignette
  alt: >-
    A small house from the Architecture pieces: a front wall with a door in the middle and a window either side, two
    side walls, and a spiral stair behind. 1: the door. 2: a window. 3: the spiral stair.
  caption: A wall with a door and two windows.
  annotate:
    - {n: 1, at: {object: Door, point: center}, shape: circle, label: door, badge: b, key: 'A **Door** fitted into the wall''s doorway.'}
    - {n: 2, at: {object: Window L, point: center}, shape: circle, label: window, badge: b, key: 'A **Window** fitted into an opening, at the wall''s sill height.'}
    - {n: 3, at: {object: Stair, point: top}, shape: circle, label: spiral stair, badge: tr, key: '**Stairs (spiral)**.'}
- id: wall-geometry
  replaces: img/architecture/wall-geometry.png
  kind: ui
  setup:
    - {create: 'Wall 6 2.8 0.2 3', name: Front, at: [-3, 0, 0], color: '#f2cc8f'}
    - {select: Front}
    - {eval: "window.__stores.inspectorKind.set('selection'); window.__stores.inspectorClose.set(false)"}
    - {wait: 1500}
    - {eval: "document.getElementById('inspector-geometry')?.scrollIntoView({block: 'center'})"}
    - {wait: 600}
  crop: {union: [{selector: '#inspector-geometry'}, {selector: '#inspector-geometry', offset: [-40, 0]}], pad: 10}
  fade: []
  alt: >-
    Properties ▸ Geometry for a wall with a door and two windows: Length, Height, Thickness, Doors, Door width and
    height, Windows, Win width and height, Sill height and Shift. 1: the doorways. 2: the window openings. 3: Shift.
  caption: Properties ▸ Geometry for a wall.
  annotate:
    - {n: 1, at: {text: Doors, within: '#inspector-geometry'}, shape: underline, badge: l, key: '**Doors**, **Door width**, **Door height**: how many doorways and their size.'}
    - {n: 2, at: {text: Windows, within: '#inspector-geometry'}, shape: underline, badge: l, key: '**Windows**, **Win width**, **Win height**, **Sill height**: the window openings.'}
    - {n: 3, at: {text: Shift, within: '#inspector-geometry'}, shape: underline, badge: l, key: '**Shift** slides the openings along the wall.'}
# the same house in Interact: a real click on the door and on the left (casement) window opens them
- id: door-open
  replaces: img/architecture/door-open.png
  kind: view
  scene: *house
  setup:
    - {camera: {pos: [2.6, 2.2, 6.4], target: [-0.4, 1.1, -1]}}
    - {wait: 1200}
    - {eval: "window.__stores.objectActions.setEditorMode('interact')"}
    - {wait: 1500}
    - {press: {object: Door, point: center}}
    - {release: true}
    - {wait: 600}
    - {press: {object: Window L, point: center}}
    - {release: true}
    - {wait: 2500}
  crop: {around: {union: [{object: Front}, {object: Stair}]}, size: [1080, 600]}
  fade: vignette
  alt: >-
    The house in Interact after a click on the door and on the casement window: the door has swung open, showing the
    spiral stair through the doorway, and the window's sash is open. 1: the open door. 2: the open window.
  caption: A door and a casement window open in Interact.
  annotate:
    - {n: 1, at: {object: Door, point: center}, shape: circle, label: click opens, badge: b, key: 'In **Interact** and **Play**, a click opens or closes a door, for everyone.'}
    - {n: 2, at: {object: Window L, point: center}, shape: circle, label: casement, badge: l, key: 'A **casement window** opens the same way.'}
