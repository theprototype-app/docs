# docs/camera.md — Render mode, the View section, grid + light helpers, Environment presets.
# Shoot: e2e-slot -- node tools/shots/shoot.cjs camera       Re-annotate: node tools/shots/annotate.cjs camera
page: camera
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
  scene:
    - {create: Box, name: Crate, at: [0, 0.8, 0], scale: 1.6, color: '#c9a26b'}
    - {create: TorusKnot, name: Knot, at: [2.5, 1.3, 0.5], scale: 0.7, color: '#81b29a'}
    - {create: Sphere, name: Ball, at: [-2.3, 0.8, 0.9], scale: 0.8, color: '#6c8cd5'}
    - {camera: {pos: [7.4, 4.6, 9], target: [0.1, 0.9, 0]}}
shots:
  - id: render-modes
    alt: >-
      The same three objects in the three render modes: Shaded, Shaded + AO (soft contact shadows where
      surfaces meet) and Wireframe (every edge).
    caption: Shaded, Shaded + AO and Wireframe. AO darkens creases and the ground where objects touch it.
    tryit: camera-render-mode
    crop: {around: {union: [{object: Crate}, {object: Knot}, {object: Ball}]}, size: [640, 400]}
    variants:
      - {store: {viewMode: shaded}, suffix: shaded, caption: Shaded}
      - {store: {viewMode: shaded-ao}, suffix: ao, caption: 'Shaded + AO'}
      - {store: {viewMode: wireframe}, suffix: wireframe, caption: Wireframe}
    compose: row

  - id: view-section
    caption: 'Configure Scene ▸ View: how the scene is drawn on your screen.'
    alt: >-
      Configure Scene ▸ View. 1: the render mode switch — Shaded, Shaded + AO, Wireframe. 2: Show light helpers.
    tryit: camera-view-section
    setup:
      - {section: View}
    crop: {selector: 'section.sec-panel:has(#view-mode-switch)', pad: 10}
    annotate:
      - {n: 1, at: {union: [{selector: '#view-mode-shaded'}, {selector: '#view-mode-wireframe'}]}, shape: box, pad: 4, badge: r, key: The **render mode** switch.}
      - {n: 2, at: {text: Show light helpers, find: 'button'}, shape: box, pad: 3, badge: l, key: '**Show light helpers**.'}

  - id: grid-and-lights
    alt: >-
      A point light and a spot light in the scene with light helpers on. 1: the point light's helper — a small
      wire sphere at the light. 2: the spot light's cone, showing where it shines.
    caption: Light helpers show where each light is and where it shines; they are editor-only.
    storage: {showLightHelpers: 'true'}
    setup:
      - {light: point, name: Lamp, at: [-1.4, 2.3, 1.8]}
      - {light: spot, name: Spot, at: [2.4, 3, 2.2]}
    crop: {rect: [180, 80, 1080, 680]}
    fade: vignette
    annotate:
      - {n: 1, at: {object: Lamp, point: center}, shape: circle, label: point light, key: "A **point light**'s helper."}
      - {n: 2, at: {object: Spot, point: center}, shape: circle, label: spot light, badge: tr, key: "A **spot light**'s helper, with the cone it shines into."}

  - id: env-presets
    alt: >-
      The same scene under four environment presets: Studio (neutral grey), Daylight (bright sky), Sunset
      (warm, low sun) and Night (dim and cool).
    caption: Studio, Daylight, Sunset and Night on the same three objects.
    tryit: camera-environment
    # lower, so the sky shows above the horizon
    setup:
      - {camera: {pos: [7.6, 2.4, 9.2], target: [0.1, 1.4, 0]}}
    crop: {around: {union: [{object: Crate}, {object: Knot}, {object: Ball}]}, size: [640, 400], offset: [0, -60]}
    variants:
      - {env: studio, suffix: studio, caption: Studio}
      - {env: daylight, suffix: daylight, caption: Daylight}
      - {env: sunset, suffix: sunset, caption: Sunset}
      - {env: night, suffix: night, caption: Night}
    compose: grid2x2

  - id: camera-object
    replaces: img/camera/camera-object.png
    caption: A camera's properties, with its preview window at the lower left.
    alt: 'A selected camera in the scene: Properties ▸ Camera with Kind, FOV, Near, Far and Framing, and the camera''s preview
      window in the corner of the view.'
    setup:
    - create: Camera
      name: Cam
      at:
      - -2
      - 2
      - 6
      keepSelected: true
    - eval: window.__stores.inspectorKind.set('selection'); window.__stores.inspectorClose.set(false)
    - wait: 1500
    crop:
      rect:
      - 752
      - 0
      - 688
      - 840
    fade:
    - l
    - b
  - id: sky-meadow
    replaces: img/camera/sky-meadow.png
    dpr: 1
    kind: view
    caption: The Meadow sky image lighting a mirror sphere and a box.
    crop:
      rect:
      - 0
      - 0
      - 1280
      - 720
    fade: []
    alt: A mirror sphere and a box lit by the Meadow sky image
    from: img/camera/sky-meadow.png
  - id: sky-image-section
    replaces: img/camera/sky-image-section.png
    caption: Configure Scene ▸ Environment, with its Sky image section.
    alt: 'Configure Scene ▸ Environment: the sky preset cards, Upload HDRI…, Rotation, Image light, Show as sky, Sky blur and
      Tone mapping.'
    setup:
    - section: Environment
    - wait: 1200
    # the Meadow card, not the Meadow preset above it: the rows it shows only exist with a sky image chosen
    - eval: "[...document.querySelectorAll('button')].filter((b) => b.textContent.includes('Meadow')).pop().click()"
    - wait: 3000
    crop:
      rect:
      - 1100
      - 56
      - 340
      - 800
    fade:
    - b
