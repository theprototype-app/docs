page: community
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
  # 83-batch3: the heart is the core seam cloudHooks.setSceneHeart (what the cloud plugin sets for a published
  # scene); the play link's start card is EmbedChrome, shown while playMode.embedMode is on (a /p/ link's boot)
  - id: play-link-heart
    replaces: img/community/play-link-heart.png
    scene:
      - eval: >-
          (async () => { const S = window.__stores, D = window.__docs; await S.sceneTemplates.loadTemplatesIndex();
          const g = D.get(S.sceneTemplates.templates).find((x) => x.slug === 'physics-playground'); await S.sceneTemplates.loadRemoteScene(g, {}); })()
      - {wait: 9000}
    setup:
      # the start card shows while the game is NOT running (EmbedChrome: {#if $isLocked !== true}), so no Play first
      - {eval: "const S = window.__stores; S.cloudHooks.setSceneHeart({ count: 0, liked: false, toggle: async () => null }); S.playMode.embedMode.set(true)"}
      - {wait: 1500}
    crop: {around: {selector: '#embed-start'}, size: [640, 420], ui: true}
    fade: [l, r, t, b]
    kind: ui
    alt: >-
      A play link's start card over the scene: the orange Play button, the heart with its count beside it, and the
      hint Click to look around · Esc to pause. 1: the heart.
    caption: The heart on a play link's start card.
    annotate:
      - {n: 1, at: {selector: '#embed-heart'}, shape: circle, label: like it, badge: r, key: 'The **heart**: press it to **like it**; the count updates at once.'}
  - id: pause-menu-heart
    replaces: img/community/pause-menu-heart.png
    scene:
      - eval: >-
          (async () => { const S = window.__stores, D = window.__docs; await S.sceneTemplates.loadTemplatesIndex();
          const g = D.get(S.sceneTemplates.games).find((x) => x.slug === 'towers'); await S.sceneTemplates.loadRemoteScene(g, {}); })()
      - {wait: 9000}
    setup:
      - {eval: "window.__stores.cloudHooks.setSceneHeart({ count: 1, liked: true, toggle: async () => null })"}
      - {eval: "window.__stores.playMode.requestPlay()"}
      - {wait: 4000}
      - {click: '#game-shell-menu-button'}
      - {wait: 1500}
    crop: {selector: '#game-shell-menu .gs-card', pad: 20}
    fade: []
    kind: ui
    alt: >-
      Towers' pause menu: the title Paused with the game's name under it and a filled heart with the count 1 at the
      top right, then Resume, Restart, Settings, How to play, Main menu and Back to editor. 1: the heart.
    caption: The heart in a published game's pause menu.
    annotate:
      - {n: 1, at: {selector: '#game-shell-heart'}, shape: circle, label: liked, badge: l, key: 'The **heart**, filled once you have **liked** the game; press it again to take the like back.'}
  - id: your-games
    replaces: img/community/your-games.png
    # stays a re-crop: Your games & stats is the cloud plugin's page for a signed-in account with published games,
    # and its numbers come from that account's stats; a headless docs run has no account to sign in with
    alt: 'Your games: visits over 30 days, one row per game, with a moderation notice'
    caption: 'Your games: visits over 30 days.'
    crop:
      rect:
      - 296
      - 40
      - 688
      - 680
    fade:
    - l
    - r
    - t
    kind: ui
    dpr: 1
    from: img/community/your-games.png
