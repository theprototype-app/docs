page: make-it-feel-like-a-real-game
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
  scene:
  - {create: Box, name: Tower, at: [-2.2, 1.5, -6], scale: [1.4, 3, 1.4], color: '#8a7f73'}
  - {create: Box, name: Wall, at: [2.4, 0.6, -5], scale: [3, 1.2, 0.6], color: '#9a9187'}
  - {create: Sphere, name: Beacon, at: [-2.2, 3.4, -6], scale: 0.6, color: '#f0b44c'}
# 92-int (roadmap 92 Games feel complete): the game menus, the title screen and a talk with choices, built live.
shots:
- id: game-menus-section
  setup:
  - &menus {eval: "window.__stores.gameMenusKit.gameMenusPlan.setGameMenus({title: {title: 'The Beacon', subtitle: 'A starter game', background: 'scene'}, pause: {on: true}, saves: true})"}
  - {wait: 600}
  - {section: Game menus}
  - {wait: 1500}
  - {eval: "document.querySelector('#scene-game-menus')?.scrollIntoView({block: 'center'})"}
  - {wait: 600}
  crop: {selector: '#scene-game-menus', pad: 24}
  fade: []
  kind: ui
  alt: >-
    Configure Scene's Game menus section with Title screen on (title The Beacon, subtitle A starter game, the scene as
    the background, Show it when I press Play here), The menu pauses the game, Three save slots and
    Auto-admit while playing. 1: the title screen settings. 2: the save slots switch.
  caption: Configure Scene ▸ Game menus.
  annotate:
  - {n: 1, at: {selector: '#game-menus-title'}, shape: box, pad: 3, badge: l, key: 'The **title screen**: its title, subtitle and background.'}
  - {n: 2, at: {selector: '#game-menus-saves'}, shape: box, pad: 3, badge: l, key: '**Three save slots**: adds Save game and Load game to the pause menu, and Continue to the title.'}
- id: title-screen
  setup:
  - *menus
  - {wait: 600}
  - {eval: "window.__stores.playMode.requestPlay()"}
  - {wait: 4000}
  - {eval: "if (!document.querySelector('#game-title-screen')) throw new Error('no title screen')"}
  crop: {selector: '#game-title-screen .ts-card', pad: 48}
  fade: []
  kind: ui
  alt: >-
    The Beacon's title screen over the dimmed scene: the title, the subtitle A starter game and the buttons Play,
    Settings and Quit to editor. 1: Play starts the game.
  caption: The title screen, when you press Play.
  annotate:
  - {n: 1, at: {selector: '[data-title-item="play"]'}, shape: box, pad: 3, badge: l, key: '**Play** starts a new game in the first empty slot.'}
- id: dialogue-choices
  device: window-688
  setup:
  - eval: >-
      (async () => { const S = window.__stores;
      const made = await S.aiTools.executeAiTool('create_objects', {objects: [{kind: 'primitive', primitive: 'Cylinder',
      name: 'Old Man', params: [0.35, 0.35, 1.8], position: [0, 0.9, -4], color: '#6c8cd5'}]});
      if (!made || made.error) throw new Error('create_objects: ' + JSON.stringify(made && made.error));
      let g; S.objectsGroup.subscribe((v) => (g = v))(); const man = g.children.find((o) => o.name === 'Old Man');
      const r = await S.aiTools.executeAiTool('set_dialogue', {object: man.uuid, radius: 2.5, lines: [
      {speaker: 'Old Man', text: 'Welcome, traveller!'},
      {speaker: 'Old Man', text: 'Will you help me find my cat?', choices: [{text: 'Yes, I will.', set: {name: 'helping', value: 1}, goto: 'yes'}, {text: 'Not today.', goto: 'no'}]},
      {label: 'yes', speaker: 'Old Man', text: 'Thank you! It went north.'},
      {label: 'no', speaker: 'Old Man', text: 'Maybe another time.'}]});
      if (!r || r.error) throw new Error('set_dialogue: ' + JSON.stringify(r && r.error)); })()
  - {wait: 800}
  - {eval: "window.__stores.playMode.requestPlay({flat: true})"}
  - {wait: 2500}
  # stand in front of the Old Man, looking at him: walking up opens the talk
  - eval: >-
      (() => { const S = window.__stores; let cam; S.globalCamera.subscribe((c) => (cam = c))();
      clearInterval(window.__docsStand); const put = () => { cam.position.set(0, 1.5, -2.1); cam.lookAt(0, 1.3, -4); cam.updateMatrixWorld(true); };
      put(); window.__docsStand = setInterval(put, 30); })()
  - {wait: 5000}
  # one press: the greeting has typed in by now, so E moves on to the question (a second press would pick a choice)
  - {key: KeyE}
  - {wait: 6000}
  - {eval: "if (document.querySelectorAll('#dialogue-box .dialogue-choice').length !== 2) throw new Error('no choices: ' + (document.querySelector('#dialogue-box')?.textContent ?? 'no box'))"}
  crop: {selector: '#dialogue-box', pad: 14}
  fade: []
  kind: ui
  alt: >-
    A dialogue box at the bottom of the game, in a small window: the speaker Old Man, the line Will you help me find
    my cat? and two choices, 1 Yes, I will. and 2 Not today. 1: the speaker. 2: the choices.
  caption: A talk with two choices, in a small window.
  annotate:
  - {n: 1, at: {selector: '#dialogue-box .dialogue-speaker'}, shape: box, pad: 3, badge: r, key: 'The **speaker**, from `Old Man:` in the lines.'}
  - {n: 2, at: {selector: '#dialogue-box .dialogue-choices'}, shape: box, pad: 3, badge: t, key: 'The **choices**: press 1 or 2, or click one.'}
