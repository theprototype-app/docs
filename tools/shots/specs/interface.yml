  fade: []
- id: dock-drop-objects
  replaces: img/interface/dock-drop-objects.png
  device: window-688-tall
  caption: Drop on the dock's tab bar; the caret shows the slot.
  setup:
  - *id001
  - wait: 700
  - *id003
  - wait: 1200
  - press:
      text: Objects
  - moveTo: '#dock-add-view'
  - wait: 600
  crop:
