# 83-batch3 (V11): a real second browser window (lib/rig.cjs `popup:` + `capture: popup`): the dock tab menu's
# Pop out the whole dock, from a small app window so the popped-out one is 688 wide too
- id: pop-out-dock
  replaces: img/interface/pop-out-dock.png
  device: window-688
  setup:
    - {create: Box, name: Crate, at: [0, 0.5, 0]}
    - {eval: "window.__stores.dockMenu.dockTab('flow'); window.__stores.dockMenu.dockTab('timeline')"}
    - {wait: 1500}
    - {eval: "window.__stores.bottomDock.bottomDockActive.set('flow')"}
    - {wait: 1000}
    - popup:
        - {rightClick: {text: Node editor}}
        - {wait: 600}
        - {clickText: Pop out the whole dock}
  capture: popup
  crop: {rect: [0, 0, 688, 600]}
  fade: [b]
  alt: >-
    A popped-out dock in its own browser window: the Node editor and the Timeline as its tabs, the Node editor open with
    its flows list, node palette and graph. 1: the window's tabs.
  caption: A popped-out dock is its own browser window.
  annotate:
    - {n: 1, at: {union: [{text: Node editor}, {text: Timeline}]}, shape: box, label: its tabs, badge: r, key: 'The dock''s **tabs**, now in their own window: drag it to another monitor.'}
- id: focus-mode-viewport-toggle
  replaces: img/interface/focus-mode-viewport-toggle.png
  device: window-688-tall
  caption: 'Focus mode, in a small window: the Viewport button shows or hides the picture-in-picture.'
  setup:
  - *id003
  - wait: 1000
  - eval: window.__stores.focusMode.enterFocus('dock')
  - wait: 1200
  crop:
    rect:
    - 0
    - 0
    - 688
    - 840
  fade: []
  alt: 'Focus mode on the docked Explorer: it fills the whole window, the Viewport button (pressed) sits just left of Exit
    focus in the tab row, and the viewport picture-in-picture shows the scene in the bottom-right corner'
- id: menu-project-compact
  replaces: img/interface/menu-project-compact.png
  caption: The main menu's Project section in the Compact layout.
