- id: dialog-delete-flow
  replaces: img/interface/dialog-delete-flow.png
  caption: A confirmation is a dialog over the dimmed screen.
  alt: Delete this flow? as a dialog over the dimmed screen, with Delete flow in red beside Cancel.
  setup:
  - eval: "const S=window.__stores, o=window.__docs.byName('Crate'); S.flowGraphsCtl.createObjectGraph(o.uuid); setTimeout(() => S.flowGraphsCtl.requestDeleteObjectGraph(o.uuid, 'Crate'), 300)"
  - wait: 1500
  crop: {selector: .md, pad: 48}
  fade: [l, r, t, b]
- id: phone-bar-drag-in
  replaces: img/interface/phone-bar-drag-in.png
  device: n6-folded
  caption: More open on a folded phone, with Move being dragged onto the bottom bar.
  alt: >-
    More open on a folded phone, with Move being dragged from More ▸ Edit down onto the bottom bar; a line marks where
    it will land between Add and Objects.
  setup:
  - click: '#ps-more'
  - wait: 1200
  - eval: "const sc=[...document.querySelectorAll('section.ps-sheet, section.ps-sheet *')].find((e)=>e.scrollHeight>e.clientHeight+20); if(!sc) throw new Error('no scroller in More'); sc.scrollTop=300"
  - wait: 600
  - press: '#ps-more-move'
  - wait: 600
  - moveTo: [86, 850]
    steps: 25
  - wait: 700
  crop:
    rect: [0, 346, 390, 550]
  fade: [t]
- id: phone-more-show-switches-light
  replaces: img/interface/phone-more-show-switches-light.png
  device: n6-folded
  theme: light
  caption: The bottom of More on a phone, in the Light theme.
  alt: >-
    Light theme: the bottom of More on a folded phone — Tools & View, then the Show switches (Selection toolbar, Dock
    tab row, Grab handle) and Reset bar.
  setup:
  - click: '#ps-more'
  - wait: 1200
  - eval: "const sc=[...document.querySelectorAll('section.ps-sheet, section.ps-sheet *')].find((e)=>e.scrollHeight>e.clientHeight+20); if(!sc) throw new Error('no scroller in More'); sc.scrollTop=sc.scrollHeight"
  - wait: 800
  crop:
    rect: [0, 346, 390, 550]
  fade: [t]
