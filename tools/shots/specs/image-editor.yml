page: image-editor
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
# 83-batch3: a picture drawn on a canvas and added to the Library (explorer.addItemFromBytes), then opened with
# imageEditor.openImageEditor — core's image-editor suite recipe. Since 1.65 the editor is the Preview window's Edit
# view (#image-preview-window holds #image-editor-window): a css step sizes the window to the column.
- id: editor-desktop
  replaces: img/image-editor/editor-desktop.png
  kind: ui
  scene: &picture
    - eval: >-
        (async () => {
          const c = document.createElement('canvas'); c.width = 640; c.height = 420;
          const x = c.getContext('2d');
          const sky = x.createLinearGradient(0, 0, 0, 300); sky.addColorStop(0, '#2c4f86'); sky.addColorStop(1, '#f2a65a');
          x.fillStyle = sky; x.fillRect(0, 0, 640, 420);
          x.fillStyle = '#ffd56b'; x.beginPath(); x.arc(420, 250, 46, 0, Math.PI * 2); x.fill();
          x.fillStyle = '#3d6b4a'; x.beginPath(); x.moveTo(0, 300); x.quadraticCurveTo(180, 220, 360, 300); x.quadraticCurveTo(500, 350, 640, 280); x.lineTo(640, 420); x.lineTo(0, 420); x.fill();
          x.fillStyle = '#2a4d36'; x.beginPath(); x.moveTo(0, 360); x.quadraticCurveTo(260, 300, 640, 370); x.lineTo(640, 420); x.lineTo(0, 420); x.fill();
          const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
          const rec = await window.__stores.explorer.addItemFromBytes(await blob.arrayBuffer(), 'sunset.png', null, { imported: true });
          window.__docsImage = rec.id;
        })()
  setup:
    - {css: '#image-preview-window{width:680px!important;height:780px!important}'}
    - {eval: "window.__stores.imageEditor.openImageEditor(window.__docsImage)"}
    - {wait: 2500}
  crop: {selector: '#image-preview-window'}
  fade: []
  alt: >-
    The Image editor on a computer, the Preview window on Edit: the filmstrip of the folder's images on the left, the
    picture with Save above it, and on the right the Edit page with Rotate and flip, Crop, Resize and Adjust. 1: rotate and flip. 2: Crop. 3: the Adjust sliders.
  caption: The Image editor on a computer.
  annotate:
    - {n: 1, at: {union: [{selector: '#image-editor-rotate-ccw'}, {selector: '#image-editor-flip-v'}]}, shape: box, pad: 3, badge: b, key: '**Rotate** 90° either way and **flip**.'}
    - {n: 2, at: {selector: '#image-editor-crop'}, shape: box, pad: 3, badge: l, key: '**Crop…** draws a crop box over the picture.'}
    - {n: 3, at: {union: [{selector: '#image-editor-brightness'}, {selector: '#image-editor-saturation'}]}, shape: bracket, badge: l, key: '**Adjust**: brightness, contrast and saturation.'}
- id: crop-desktop-light
  replaces: img/image-editor/crop-desktop-light.png
  theme: light
  kind: ui
  scene: *picture
  setup:
    - {css: &narrow '#image-preview-window{width:680px!important;height:560px!important}'}
    - {eval: "window.__stores.imageEditor.openImageEditor(window.__docsImage)"}
    - {wait: 2500}
    - {click: '#image-editor-crop'}
    - {wait: 500}
    # a crop box drawn with the mouse (core §5)
    - {press: {selector: '#image-editor-canvas-wrap', dx: -110, dy: -70}}
    - {moveTo: {selector: '#image-editor-canvas-wrap', dx: 90, dy: 60}, steps: 12}
    - {release: true}
    - {wait: 600}
  crop: {selector: '#image-preview-window'}
  fade: []
  alt: >-
    Cropping on a computer in the light theme: the crop box drawn over the picture with its size badge, and in the
    sidebar the crop shape, X, Y, W and H and Apply crop. 1: the crop box. 2: X, Y, W and H. 3: Apply crop.
  caption: Cropping on a computer in the light theme.
  annotate:
    - {n: 1, at: {selector: '#image-editor-crop-badge'}, shape: underline, badge: b, key: 'The **crop box**: drag it or its corners; Enter applies, Esc cancels.'}
    - {n: 2, at: {union: [{selector: '#image-editor-crop-x'}, {selector: '#image-editor-crop-h'}]}, shape: box, pad: 3, badge: l, key: '**X**, **Y**, **W**, **H**: the box in pixels.'}
    - {n: 3, at: {selector: '#image-editor-crop-apply'}, shape: box, pad: 3, badge: l, key: '**Apply crop**.'}
- id: versions-desktop
  replaces: img/image-editor/versions-desktop.png
  kind: ui
  scene: *picture
  setup:
    - {css: *narrow}
    - {eval: "window.__stores.imageEditor.openImageEditor(window.__docsImage)"}
    - {wait: 2500}
    - {click: '#image-editor-rotate-cw'}
    - {click: '#image-editor-save'}
    - {wait: 2000}
    - {click: '#image-editor-window [data-ws-mode="history"]'}
    - {wait: 800}
  crop: {selector: '#image-preview-window'}
  fade: []
  alt: >-
    The Versions page after one Save: Restore original at the top, then the current edit and the original image
    below it. 1: Restore original.
  caption: The Versions page.
  annotate:
    - {n: 1, at: {selector: '#image-editor-restore-original'}, shape: box, pad: 3, badge: b, key: '**Restore original** puts the image back as it was imported; every Save keeps the version before it.'}
# in a 688 px wide app window, so the whole dock is the column's width. 1.65: the Preview pinned to the dock (its pin,
# pressed in the DOM: at 688 px the floating window's header can sit where a pointer cannot reach it), on Edit
- id: docked
  replaces: img/image-editor/docked.png
  device: window-688-tall
  kind: ui
  scene: *picture
  setup:
    - {eval: "window.__stores.dockMenu.dockTab('flow')"}
    - {wait: 1200}
    - {eval: "window.__stores.imageEditor.openImageEditor(window.__docsImage)"}
    - {wait: 2000}
    - {eval: "document.getElementById('preview-pin').click()"}
    - {wait: 1800}
    - {eval: "if (document.getElementById('image-preview-window')?.dataset.previewPinned !== 'true') throw new Error('the preview did not pin to the dock')"}
    - {eval: "document.querySelector('.dt-tabs [data-dock-tab=\"preview\"]')?.click()"}
    - {wait: 1200}
  crop: {union: [{selector: '.dt-tabs'}, {selector: '#image-preview-window'}], pad: 8, maxHeight: 368}
  fade: [b]
  alt: >-
    The Preview pinned as a tab of the bottom dock, beside the Node editor, open on Edit: the filmstrip on the left,
    the picture, and the Edit page with the image tools. 1: the Preview tab. 2: Edit.
  caption: The image editor in the docked Preview tab.
  annotate:
    - {n: 1, at: {selector: '.dt-tabs [data-dock-tab="preview"]'}, shape: box, pad: 2, badge: l, key: 'Docked, the **Preview** is one more tab in the bottom dock; it follows the Explorer selection.'}
    - {n: 2, at: {selector: '#preview-edit'}, shape: box, pad: 3, badge: b, key: '**Edit** on an image opens the editor in that tab.'}
# a phone: a sheet over the bottom, the Play bar left uncovered (core §11); the whole screen is the shot
- id: editor-phone
  replaces: img/image-editor/editor-phone.png
  device: n6-folded
  kind: ui
  scene: *picture
  setup:
    - {eval: "window.__stores.imageEditor.openImageEditor(window.__docsImage)"}
    - {wait: 2500}
    # 1.65: the Edit page opens from the editor's edge tab (h.openWsMode's way)
    - {click: '#image-editor-window .ws-root > [data-ws-secondary-toggle]'}
    - {wait: 800}
  crop: {rect: [0, 0, 390, 896]}
  fade: []
  alt: >-
    The Image editor on a phone: the picture at the top, the Edit page under it, and the bottom bar with Play below.
    1: the Edit page. 2: Play, still reachable.
  caption: The Image editor on a phone.
  annotate:
    - {n: 1, at: {selector: '#image-editor-window .ws-panel-head [data-ws-mode="edit"]'}, shape: underline, pad: 2, badge: b, key: 'The **Edit** and **Versions** pages open under the picture, from the pencil tab at its edge.'}
    - {n: 2, at: {selector: '#ps-play'}, shape: box, pad: 3, badge: t, key: 'The sheet leaves **Play** uncovered.'}
