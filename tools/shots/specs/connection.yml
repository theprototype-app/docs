page: connection
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
# 83-batch3 (V11): real two-peer shots from the rig (lib/rig.cjs `peers:`), no longer re-crops of older captures.
# The cloud build lists people in the project's OTHER rooms under the panel (cross-scene presence) — on production
# those can be real accounts, so the shots hide that block.
- id: status-dot-phone
  replaces: img/connection/status-dot-phone.png
  device: n6-folded
  peers:
    - {name: Mia}
  setup:
    - {camera: {pos: [4, 3, 6], target: [0, 1, 0]}}
    - {wait: 4000}
  crop: {rect: [0, 0, 390, 120]}
  fade: []
  alt: >-
    The top bar of a folded phone with one other person connected: the logo, the connection chip with its dot, ▾ and
    the microphone, then the bell and the peers button with 2. 1: the connection dot.
  caption: 'A folded phone''s top bar: the chip keeps the connection dot.'
  annotate:
    - {n: 1, at: {selector: '.ps-dot'}, shape: circle, label: connected, badge: b, key: 'The **dot**: its colour is the connection state (the table above).'}
- id: peers-panel-desktop
  replaces: img/connection/peers-panel-desktop.png
  storage: {username: Alexandra, usernameCustom: '1'}
  peers:
    - {name: Maximilian, role: edit}
    - {name: Bo, role: view}
    - {name: Guinevere, role: edit}
  setup:
    - {css: '#cross-scene-presence{display:none!important}'}
    - {camera: {pos: [4, 3, 6], target: [0, 1, 0]}}
    - {eval: "window.__stores.peersPanelOpen.set(true)"}
    - {wait: 2000}
  crop: {selector: '#peers-popover', pad: 8}
  fade: []
  alt: >-
    The Connected panel on a computer with four people, one row each: an avatar, the name, the scene they are in, the
    ping and their short id underneath, then their role (Admin, Editor or Viewer) and Watch on the right. 1: you. 2: a
    person's role list.
  caption: The Connected panel on a computer.
  annotate:
    - {n: 1, at: {text: (you)}, shape: box, label: you, badge: r, key: '**(you)**: your own row; the host is **Admin**.'}
    - {n: 2, at: {selector: '.role-btn', nth: 0}, shape: box, label: role, badge: t, key: 'A person''s **role** (Editor or Viewer): the host changes it here.'}
- id: guests-see
  replaces: img/connection/guests-see.png
  alt: >-
    The Connect drawer's Info tab on a computer: the Session rows — State, Your ID, Guests see with its list, Host —
    and the Signaling server rows under them. 1: Guests see, which of your files a guest sees in the Explorer.
  caption: Connect ▸ ▾ ▸ Info, where the host picks what guests see.
  setup:
    - {eval: "window.__stores.connectDrawerOpen.set(true)"}
    - {wait: 1200}
  crop: {selector: '[data-testid="connect-info-drawer"]', pad: 8}
  fade: []
  annotate:
    - {n: 1, at: {selector: '#session-share-scope'}, shape: box, label: guests see, badge: b, key: '**Guests see**: which of your files a guest sees in the Explorer (read-only).'}
