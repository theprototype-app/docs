# docs/saving.md — Save options.
# Shoot: e2e-slot -- node tools/shots/shoot.cjs saving     Re-annotate: node tools/shots/annotate.cjs saving
# 83-batch3: a real capture (was a re-crop of the 41b evidence). The dialog the burger's Save ▾ ⚙ opens.
page: saving
defaults:
  device: desktop
  theme: dark
  dpr: 2
  format: webp
shots:
  - id: save-options
    replaces: img/saving/save-options.png
    alt: >-
      Save options on a computer: Save as Project or Scene, what a scene (.tpscene) includes — assets, imported packs,
      the flow graph — what a project (.tp) includes, and More formats, with Cancel and Save at the bottom.
    caption: Save options on a computer.
    setup:
      - {eval: "window.__stores.saveOptions.saveOptionsOpen.set(true)"}
      - {wait: 1200}
    crop: {selector: '#save-options-modal'}
